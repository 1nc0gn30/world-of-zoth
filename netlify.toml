[build]
  publish = "site"
  command = "bash tools/build.sh && bash tools/build_site.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/play/assets/voice/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/play"
  to = "/play/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
