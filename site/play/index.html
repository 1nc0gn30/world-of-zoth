<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Play World of Zoth — 3D Cyber-RPG &amp; GhostByte AI Academy</title>
  <meta name="description" content="Play World of Zoth directly in your browser. 20 playable 3D districts, GhostByte 3D AI Companion with neural voice-overs, 4 real-time Sovereign Operations, and 20 Null Academy AI labs.">
  <link rel="canonical" href="https://world-of-zoth.netlify.app/play/">
  <link rel="icon" type="image/png" href="/assets/ghostbyte-icon.png">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #060504;
      overflow: hidden;
      touch-action: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #screen {
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      background: #060504;
      outline: none;
    }
    .portal-back {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(6, 8, 14, 0.78);
      border: 1px solid rgba(0, 213, 255, 0.42);
      color: #00d5ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(8px);
      opacity: 0.78;
      transition: opacity 160ms ease, border-color 160ms ease;
    }
    .portal-back:hover, .portal-back:focus-visible {
      opacity: 1;
      border-color: #f5b82e;
      color: #f5b82e;
    }
  </style>
</head>
<body>
  <a href="/" class="portal-back" title="Back to World of Zoth Portal">← PORTAL</a>
  <canvas id="screen" width="960" height="540" tabindex="0" aria-label="World of Zoth 3D Lattice RPG Interactive Canvas"></canvas>
  <script src="/play/game.js"></script>
</body>
</html>
